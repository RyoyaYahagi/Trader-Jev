[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "trader-jev"
version = "0.1.0"
description = "A replayable and auditable research platform for Jev-assisted intraday trading decisions."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Trader-Jev contributors" }]
dependencies = [
    "duckdb>=1.1,<2",
    "lightgbm>=4.5,<5",
    "moomoo-api==10.11.7108",
    "numpy>=1.24,<3",
    "polars>=1.20,<2",
    "pydantic>=2.8,<3",
    "PyYAML>=6.0,<7",
]

[project.scripts]
trader-jev-paper = "trader_jev.cli:main"
trader-jev-train = "trader_jev.ml_cli:main"
trader-jev-forward-paper = "trader_jev.forward_paper:main"
trader-jev-experiment-worker = "trader_jev.experiment_worker:main"
trader-jev-dashboard = "trader_jev.dashboard_server:main"
trader-jev-experiment = "trader_jev.experiment_cli:main"

[dependency-groups]
dev = [
    "pyright>=1.1.390,<2",
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<1",
    "ruff>=0.8,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/trader_jev"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B017"]

[tool.pyright]
include = ["src", "tests"]
exclude = [".venv"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
typeCheckingMode = "strict"
reportMissingTypeStubs = false

[tool.uv]
default-groups = ["dev"]
